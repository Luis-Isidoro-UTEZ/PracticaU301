<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Demo Usuarios</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 40px;
            }

            input, button {
                padding: 6px;
                margin: 5px;
            }

            .error {
                color: red;
                margin-top: 5px;
            }

            .success {
                color: green;
                margin-top: 5px;
            }

            .user-card {
                border: 1px solid #aaa;
                padding: 10px;
                margin-top: 10px;
                width: 260px;
            }
        </style>
    </head>
    <body>
        <h1>Gestión de Usuarios (Demo)</h1>
        <hr>
        <h2>Buscar Usuario por ID</h2>
        <input id="userId" type="number" placeholder="ID">
        <button onclick="getUser()">Buscar</button>
        <div id="user-result"></div>
        <hr>
        <h2>Listar Usuarios</h2>
        <button onclick="loadUsers()">Cargar Lista</button>
        <div id="user-list"></div>
        <script>
            async function getUser() {
                const id = document.getElementById("userId").value;
                const container = document.getElementById("user-result");
                container.innerHTML = "";

                const response = await fetch("/users/" + id);

                if (!response.ok) {
                    container.innerHTML = "<p class='error'>Usuario no encontrado</p>";
                    return;
                }

                const user = await response.json();

                container.innerHTML = `
                    <div class="user-card">
                        <b>ID:</b> ${user.id}<br>
                        <b>Nombre:</b> ${user.name}<br>
                        <b>Apellido:</b> ${user.lastname}<br>
                        <b>Edad:</b> ${user.age}<br>
                        <b>Email:</b> ${user.email}
                    </div>
                `;
            }

            async function loadUsers() {
                const container = document.getElementById("user-list");
                container.innerHTML = "";

                const response = await fetch("/users");
                const users = await response.json();

                users.forEach(user => {
                    container.innerHTML += `
                    <div class="user-card">
                        <b>ID:</b> ${user.id}<br>
                        <b>Nombre:</b> ${user.name}<br>
                        <b>Apellido:</b> ${user.lastname}<br>
                        <b>Edad:</b> ${user.age}<br>
                        <b>Email:</b> ${user.email}
                    </div>
                `;
                });
            }
        </script>
    </body>
</html>
